; Octopus-Bridge: ESP32-S3-DevKitC-1 N16R8 at the BTT Octopus Pro, connects the grblHAL display
; (ESP32-P4) to the controller, see README.md. ESP-IDF for the USB host (CDC-ACM).

[env:bridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; the COM port of the "UART" socket (CH343) differs per PC: pio run -t upload --upload-port COMx
monitor_speed = 115200
upload_speed = 921600
